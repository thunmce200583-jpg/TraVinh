<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Du Lịch & Văn Hóa Trà Vinh</title>
  <style>
    /* -------------------------------------------------------------
       BASE / MOBILE STYLES (< 772px) - Mobile First Approach
       ------------------------------------------------------------- */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #ffffff;
      color: #333333;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    /* Layout CSS Grid cơ bản 1 cột cho điện thoại */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    figure {
      margin: 0;
      padding: 10px;
      background-color: #f4f4f4;
      border: 1px solid #ddd;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    figure img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    figcaption {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      padding: 10px;
      border-top: 1px solid #ccc;
      font-size: 0.9rem;
    }

    /* -------------------------------------------------------------
       FEATURE 1: TABLET VIEW (min-width: 772px)
       Grid 2 cột, hình ảnh bo tròn 50%, thẻ cuối span 2 cột
       ------------------------------------------------------------- */
    @media screen and (min-width: 772px) {
      .grid-container {
        grid-template-columns: 1fr 1fr;
      }

      figure {
        border-radius: 50%;
        overflow: hidden;
        padding: 20px;
        aspect-ratio: 1 / 1;
        justify-content: center;
      }

      figure img {
        border-radius: 50%;
        width: 80%;
        height: 80%;
      }

      /* Thẻ cuối cùng trải rộng 2 cột */
      figure:last-child {
        grid-column: span 2;
      }
    }

    /* -------------------------------------------------------------
       FEATURE 2: DESKTOP VIEW (min-width: 992px)
       Khôi phục hình vuông, mỗi thẻ thứ 3 (3n) span 2 cột
       ------------------------------------------------------------- */
    @media screen and (min-width: 992px) {
      figure {
        border-radius: 0;
        aspect-ratio: auto;
      }

      figure img {
        border-radius: 0;
        width: 100%;
        height: auto;
      }

      figure:last-child {
        grid-column: auto;
      }

      /* Kỹ thuật nâng cao: mỗi thẻ thứ 3n trải qua 2 cột */
      figure:nth-child(3n) {
        grid-column: span 2;
      }
    }

    /* -------------------------------------------------------------
       FEATURE 3: PREFERS REDUCED MOTION
       Tắt tất cả hiệu ứng chuyển động nếu người dùng bật reduced motion
       ------------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto !important;
      }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* -------------------------------------------------------------
       FEATURE 4: PREFERS COLOR SCHEME (DARK MODE)
       Độ tương phản cao đạt chuẩn WCAG AAA (Nền tối, chữ vàng #ffff80)
       ------------------------------------------------------------- */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #ffffff;
      }
      figure {
        background-color: #222222;
        color: #ffff80;
        border: 2px solid #000000;
      }
      footer {
        border-top-color: #444;
      }
    }
  </style>
</head>
